name: ProbeApp
options:
  bundleIdPrefix: dev.yxxbc
  deploymentTarget:
    iOS: "17.0"
targets:
  ProbeApp:
    type: application
    platform: iOS
    sources:
      - path: ProbeApp
    dependencies:
      - framework: ../All.xcframework
        embed: false
    info:
      path: ProbeApp/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yxxbc.probe
        GENERATE_INFOPLIST_FILE: NO
        # A device needs a development signing identity, which only a team
        # and an Apple ID give; a simulator does not. The settings below
        # sign automatically once a team is chosen, and fall back to ad hoc
        # on a simulator so that the build works before that is done.
        CODE_SIGN_ENTITLEMENTS: ProbeApp/ProbeApp.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  ProbeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProbeAppTests
    dependencies:
      - target: ProbeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
